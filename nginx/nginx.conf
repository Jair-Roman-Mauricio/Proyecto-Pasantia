events {}

http {
  include mime.types;

  # ── HTTP: redirige a HTTPS (excepto el challenge de renovación de Certbot) ──
  server {
    listen 80;
    server_name TU-DOMINIO.duckdns.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS: servidor principal ──────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name TU-DOMINIO.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/TU-DOMINIO.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU-DOMINIO.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy al backend FastAPI
    location /api/ {
      proxy_pass         http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-Proto https;
    }

    # WebSockets
    location /ws/ {
      proxy_pass         http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }
  }
}
